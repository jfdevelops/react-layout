name: CI

on:
  workflow_call:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  packages:
    name: Packages Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck library
        run: pnpm typecheck

      - name: Build library
        run: pnpm build

      - name: Verify published factory types on TypeScript 5.9 and 6
        run: pnpm --filter @jfdevelops/react-layout test:types:published

      - name: Build example app
        run: pnpm --filter basic-example build

      - name: Verify changeset
        # The version PR has already consumed its changesets into package versions.
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref != 'changeset-release/main' ||
           github.event.pull_request.head.repo.full_name != github.repository)
        run: pnpm changeset status --since=origin/main

  tests:
    name: Tests (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - '@jfdevelops/react-layout-validator'
          - '@jfdevelops/react-layout-composables'
          - '@jfdevelops/react-layout-composable-breadcrumb'
          - '@jfdevelops/react-layout'
          - '@jfdevelops/react-layout-devtools-core'
          - '@jfdevelops/react-layout-devtools-react'
          - '@jfdevelops/react-layout-devtools-vite'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        shell: bash
        env:
          TEST_PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail

          temp_summary="$(mktemp)"
          trap 'rm -f "$temp_summary"' EXIT
          test_status=0

          GITHUB_STEP_SUMMARY="$temp_summary" pnpm --filter "$TEST_PACKAGE" test || test_status=$?

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" && -s "$temp_summary" ]]; then
            sed "1s|^## Vitest Test Report$|## ${TEST_PACKAGE} Test Report|" "$temp_summary" >> "$GITHUB_STEP_SUMMARY"
            printf '\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$test_status"
